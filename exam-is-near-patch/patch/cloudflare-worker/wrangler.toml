name = "exam-is-near-groq-proxy"
main = "src/index.js"
compatibility_date = "2024-09-01"
account_id = "f8ff901e93f99edc316c8e15784c9c81"

# Non-secret config — safe to commit.
[vars]
FIREBASE_PROJECT_ID = "exam-is-near"

# R2 bucket for uploaded files (replaces Firebase Storage).
# Create it first with: wrangler r2 bucket create exam-is-near-files
[[r2_buckets]]
binding = "FILES_BUCKET"
bucket_name = "exam-is-near-files"

# Secrets are NOT set here. After first deploy, run each of these and
# paste the value when prompted. They're stored encrypted on Cloudflare's
# side, never in this file or your git history:
#   wrangler secret put GROQ_API_KEY
#   wrangler secret put FIREBASE_CLIENT_EMAIL
#   wrangler secret put FIREBASE_PRIVATE_KEY
#   wrangler secret put RZP_KEY_ID
#   wrangler secret put RZP_KEY_SECRET
